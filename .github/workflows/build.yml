name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installeer XcodeGen
        run: brew install xcodegen

      - name: Genereer Xcode-project
        run: xcodegen generate

      - name: Bouw (zonder ondertekening)
        run: |
          xcodebuild \
            -project UnityRemote.xcodeproj \
            -scheme UnityRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Maak IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/UnityRemote.app Payload/
          zip -r UnityRemote.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: UnityRemote-ipa
          path: UnityRemote.ipa
